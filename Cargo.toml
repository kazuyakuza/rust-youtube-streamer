[package]
name = "rust-youtube-streamer-service"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "rust-youtube-streamer-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
