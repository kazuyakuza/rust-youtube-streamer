[package]
name = "rust-youtube-streamer-service"
version = "0.13.0"
edition = "2021"

[[bin]]
name = "rust-youtube-streamer-service"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
ctrlc = "3"
oauth2 = { version = "5.0", default-features = false, features = ["ureq"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros"] }
tonic = { version = "0.13", default-features = false, features = ["channel", "prost", "codegen", "tls-ring", "tls-webpki-roots"] }
prost = { version = "0.13", default-features = false, features = ["derive", "std"] }

[dev-dependencies]
tempfile = "3"
